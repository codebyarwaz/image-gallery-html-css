<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>My Image Gallery</h1>
      <p>A collection of beautiful moments</p>
    </header>

    <section class="gallery">
      <div class="image-box">
        <img src="Images/blake-verdoorn.jpg" alt="Nature" />
        <div class="caption">Beautiful Nature</div>
      </div>

      <div class="image-box">
        <img src="Images/isaac-sloman.jpg" alt="Beach" />
        <div class="caption">Peaceful Beach</div>
      </div>

      <div class="image-box">
        <img src="Images/johannes-andersson.jpg" alt="Mountain" />
        <div class="caption">Mountain View</div>
      </div>

      <div class="image-box">
        <img src="Images/leandro-rossi.jpg" alt="Landscape" />
        <div class="caption">Beautiful Landscape</div>
      </div>

      <div class="image-box">
        <img src="Images/osknib.jpg" alt="Forest" />
        <div class="caption">Green Forest</div>
      </div>

      <div class="image-box">
        <img src="Images/robert-lukeman.jpg" alt="Lake" />
        <div class="caption">Beautiful Lake</div>
      </div>
    </section>
  </body>
</html>
